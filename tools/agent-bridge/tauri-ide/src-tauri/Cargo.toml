[package]
name = "tauri-ide"
version = "0.1.0"
description = "Antigravity IDE — native desktop shell hosting Penpot canvas, markup editor, and agent chat"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "tauri_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
