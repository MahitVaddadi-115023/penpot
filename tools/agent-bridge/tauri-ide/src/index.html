<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antigravity IDE</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252525;
      --panel-hover: #2c2c2c;
      --panel-active: #3a3146;
      --border: #3a3a3a;
      --accent: #b692f6;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --status-bg: #181818;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ---------------- layout ------------------------------------------- */
    body {
      display: grid;
      grid-template-columns: 220px 1fr 360px;
      grid-template-rows: 1fr 320px 24px;
      grid-template-areas:
        "tree editor chat"
        "tree canvas chat"
        "status status status";
      gap: 1px;
      background: var(--border); /* shows through as 1px grid lines */
    }
    body.hide-tree   { grid-template-columns: 0 1fr 360px; }
    body.hide-chat   { grid-template-columns: 220px 1fr 0; }
    body.hide-tree.hide-chat { grid-template-columns: 0 1fr 0; }
    body.hide-canvas { grid-template-rows: 1fr 0 24px; }

    .pane { background: var(--panel); overflow: hidden; min-width: 0; min-height: 0; }
    .file-tree { grid-area: tree; display: flex; flex-direction: column; }
    .editor    { grid-area: editor; display: flex; flex-direction: column; }
    .canvas    { grid-area: canvas; display: flex; flex-direction: column; }
    .chat      { grid-area: chat;   display: flex; flex-direction: column; }
    .status    { grid-area: status; background: var(--status-bg); border-top: 1px solid var(--border); padding: 4px 10px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
    body.hide-tree   .file-tree,
    body.hide-chat   .chat,
    body.hide-canvas .canvas { display: none; }

    /* ---------------- pane header -------------------------------------- */
    .pane-header {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #1f1f1f;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .pane-header button, .pane-header select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
    }
    .pane-header button:hover { background: var(--panel-hover); border-color: var(--accent); }
    .pane-body { flex: 1 1 auto; overflow: auto; }

    /* ---------------- file tree ---------------------------------------- */
    .tree-list { list-style: none; margin: 0; padding: 4px 0; }
    .tree-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12.5px;
      height: 28px;
      user-select: none;
    }
    .tree-item:hover { background: var(--panel-hover); }
    .tree-item.active { background: var(--panel-active); color: var(--text); }
    .tree-item .glyph { width: 14px; opacity: 0.8; text-align: center; }
    .tree-empty { padding: 10px; color: var(--muted); font-style: italic; font-size: 12px; }

    /* ---------------- editor body -------------------------------------- */
    .editor-frame, .canvas-frame {
      flex: 1 1 auto;
      border: 0;
      width: 100%;
      background: var(--bg);
    }

    /* ---------------- editor tab bar (v3 multi-file) ------------------- */
    .tab-bar {
      flex: 0 0 auto;
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 28px;
      max-height: 28px;
    }
    .tab-bar:empty { display: none; }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 10px;
      background: #252525;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-top: 2px solid transparent;
      max-width: 240px;
    }
    .tab:hover { background: var(--panel-hover); color: var(--text); }
    .tab.active {
      background: #3a3146;
      color: var(--text);
      border-top-color: var(--accent);
    }
    .tab .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .tab .tab-dirty {
      color: var(--accent);
      font-weight: bold;
      min-width: 8px;
      display: inline-block;
    }
    .tab .tab-close {
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
    }
    .tab .tab-close:hover { background: #4a4a4a; color: var(--text); }

    /* ---------------- chat pane ---------------------------------------- */
    .chat-log {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-empty {
      color: var(--muted);
      font-style: italic;
      font-size: 12.5px;
      padding: 12px 4px;
    }
    .bubble {
      max-width: 92%;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid var(--border);
    }
    .bubble.user      { align-self: flex-end; background: #2e2740; border-color: #4a3a6e; color: #efe6ff; }
    .bubble.assistant { align-self: flex-start; background: #1f1f1f; color: var(--text); }
    .bubble.system    { align-self: center; background: transparent; border: 0; color: var(--muted); font-style: italic; font-size: 11.5px; max-width: 100%; }
    .bubble.error     { align-self: flex-start; background: #3a1f1f; border-color: #6e3a3a; color: #ffb4b4; }
    .bubble .role-tag {
      display: block; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2px;
    }

    .chat-composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1f1f1f;
    }
    .chat-composer .row {
      display: flex; gap: 6px; align-items: center;
    }
    .chat-composer select {
      flex: 1 1 auto;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 12px;
    }
    .chat-composer textarea {
      width: 100%;
      min-height: 56px;
      max-height: 200px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font: 12.5px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    .chat-composer textarea:focus { outline: none; border-color: var(--accent); }
    .chat-composer .actions { display: flex; gap: 6px; justify-content: flex-end; }
    .chat-composer button {
      background: var(--accent);
      color: #1c1428;
      border: 0;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chat-composer button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .chat-composer button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------------- status bar --------------------------------------- */
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; display: inline-block;
    }
    .status .dot.ok   { background: #6ad28a; }
    .status .dot.warn { background: #d2b06a; }
    .status .dot.err  { background: #d26a6a; }
    .status .spacer { flex: 1; }
    .status .accent { color: var(--accent); }

    /* ---------------- modal -------------------------------------------- */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      width: 460px;
      max-width: 90vw;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .modal h3 {
      margin: 0 0 10px; font-size: 14px; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .modal label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-top: 8px; }
    .modal textarea, .modal input, .modal select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      margin-top: 4px;
      font: 12.5px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
    .modal button {
      background: var(--accent); color: #1c1428; border: 0; border-radius: 4px;
      padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .modal button.secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- File tree -->
  <aside class="pane file-tree">
    <div class="pane-header">
      <span>Markups</span>
      <span style="display:flex; gap:4px;">
        <button id="btn-refresh" title="Refresh">&#x21bb;</button>
        <button id="btn-new" title="New Markup">+ New</button>
      </span>
    </div>
    <div class="pane-body">
      <ul class="tree-list" id="tree-list">
        <li class="tree-empty">Loading…</li>
      </ul>
    </div>
  </aside>

  <!-- Editor (plugin iframe). The plugin owns the markup textarea; we drive it
       via postMessage (load-markup / save-markup-request) — see the
       "Tauri IDE companion" listener in agent-plugin/index.html. -->
  <main class="pane editor">
    <div class="pane-header">
      <span id="editor-label">Editor</span>
      <span style="display:flex; gap:4px;">
        <button id="btn-show-plugin" title="Show full plugin UI">Plugin</button>
        <button id="btn-save-all" title="Save all dirty files (Alt+Cmd+S)">Save All</button>
        <button id="btn-save" title="Save active markup (Cmd+S)">Save</button>
      </span>
    </div>
    <div class="tab-bar" id="tab-bar"></div>
    <iframe class="editor-frame" id="editor-frame" src="http://localhost:9010/agent-plugin/index.html"></iframe>
  </main>

  <!-- Chat — talks directly to newcore (:3777), independent of the editor's
       chat panel. Avoids a second WS-bridge consumer (the editor iframe
       still owns the WebSocket to localhost:9010/ws). -->
  <aside class="pane chat">
    <div class="pane-header">
      <span>Agent Chat</span>
      <span id="chat-state" class="accent">disconnected</span>
    </div>
    <div class="chat-log" id="chat-log">
      <div class="chat-empty" id="chat-empty">Talk to newcore. Pick a model and send a message.</div>
    </div>
    <div class="chat-composer">
      <div class="row">
        <select id="chat-model" disabled><option value="">(loading models…)</option></select>
        <button class="secondary" id="chat-retry" title="Reload models">&#x21bb;</button>
      </div>
      <textarea id="chat-input" placeholder="Message newcore… (Cmd+Enter to send)"></textarea>
      <div class="actions">
        <button class="secondary" id="chat-clear">Clear</button>
        <button id="chat-send" disabled>Send</button>
      </div>
    </div>
  </aside>

  <!-- Canvas (Penpot iframe) -->
  <section class="pane canvas">
    <div class="pane-header">
      <span>Penpot Canvas</span>
      <span style="display:flex; gap:4px;">
        <button id="btn-reload-canvas" title="Reload canvas">&#x21bb;</button>
        <button id="btn-canvas-fullscreen" title="Open canvas in browser">Open ↗</button>
      </span>
    </div>
    <iframe class="canvas-frame" id="canvas-frame" src="http://localhost:9001/auto-login.html"></iframe>
  </section>

  <!-- Status bar -->
  <footer class="status">
    <span><span id="status-dot" class="dot"></span> <span id="status-text">Booting…</span></span>
    <span class="spacer"></span>
    <span id="agent-state" class="accent" style="display:none;">agent: idle</span>
    <span id="status-active">No file selected</span>
    <span>Antigravity IDE v0.2</span>
  </footer>

  <!-- Agent Start modal -->
  <div class="modal-bg" id="agent-modal">
    <div class="modal">
      <h3>Start Agent</h3>
      <label for="agent-task">Task</label>
      <textarea id="agent-task" placeholder="Describe what the agent should do (e.g. 'list shapes on the current page and report counts')"></textarea>
      <label for="agent-model">Model (optional — newcore will default if blank)</label>
      <select id="agent-model"><option value="">(default)</option></select>
      <div class="actions">
        <button class="secondary" id="agent-cancel">Cancel</button>
        <button id="agent-launch">Launch</button>
      </div>
    </div>
  </div>

  <script>
    // ----- Tauri bridge (graceful no-op in plain-browser preview) ----------
    const TAURI = (typeof window !== 'undefined') && window.__TAURI__;
    const invoke = TAURI ? TAURI.core.invoke : async () => { throw new Error('not in Tauri'); };
    const listen = TAURI ? TAURI.event.listen : async () => () => {};

    // ----- constants -------------------------------------------------------
    const NEWCORE_BASE = 'http://localhost:3777';
    const AGENT_POLL_MS = 500;
    const AGENT_POLL_TIMEOUT_MS = 5 * 60 * 1000;

    // ----- state -----------------------------------------------------------
    let markups = [];
    // Open files: filename → { content, dirty, lastSavedContent }.
    // `content` is the live editor content (updated via the plugin's
    // `markup-changed` postMessage). `lastSavedContent` is what's on disk
    // (updated on successful write). `dirty` is just (content !== lastSavedContent).
    const openFiles = new Map();
    let activeFile = null;       // filename of the currently-displayed tab
    let saveResolver = null;     // resolves with the plugin's save-markup-response
    let chatModels = [];
    let chatInFlight = false;
    let agentPollId = null;
    let agentPollTimer = null;
    let agentPollStartedAt = 0;

    // ----- helpers ---------------------------------------------------------
    const $ = (id) => document.getElementById(id);

    function setStatus(text, kind) {
      $('status-text').textContent = text;
      $('status-dot').className = 'dot ' + (kind || '');
    }
    function setActive(label) {
      $('status-active').textContent = label || 'No file selected';
    }
    function setAgentState(text, kind) {
      const el = $('agent-state');
      if (!text) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.textContent = 'agent: ' + text;
      el.style.color = (kind === 'err') ? '#d26a6a' : (kind === 'ok' ? '#6ad28a' : '');
    }
    async function emitLog(level, message) {
      try { await invoke('agent_log', { level, message }); }
      catch (_) { /* not in Tauri */ }
    }

    // ----- editor iframe postMessage --------------------------------------
    function postToEditor(msg) {
      const frame = $('editor-frame');
      if (frame && frame.contentWindow) {
        try { frame.contentWindow.postMessage(msg, '*'); } catch (_) { /* ignore */ }
      }
    }

    // Save flow: we ask the plugin for its current markup-area content via
    // postMessage. The plugin replies asynchronously via parent postMessage
    // with { type: 'save-markup-response', filename, content }.
    function requestSaveFromEditor(filename, timeoutMs) {
      return new Promise((resolve, reject) => {
        // If someone is already waiting, abandon them (stale) — we only
        // care about the freshest save request.
        if (saveResolver) {
          try { saveResolver({ filename: null, content: null, stale: true }); } catch (_) {}
          saveResolver = null;
        }
        const to = setTimeout(() => {
          if (saveResolver) {
            saveResolver = null;
            reject(new Error('save-markup-response timeout (is the plugin iframe loaded?)'));
          }
        }, timeoutMs || 2000);
        saveResolver = (payload) => {
          clearTimeout(to);
          saveResolver = null;
          resolve(payload);
        };
        postToEditor({ type: 'save-markup-request', filename: filename });
      });
    }

    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'save-markup-response') {
        if (saveResolver) saveResolver({ filename: d.filename, content: d.content });
      } else if (d.type === 'markup-changed' && typeof d.content === 'string') {
        // The plugin reports textarea content (debounced 200ms). Always
        // attribute changes to the active file. If the plugin is showing
        // its own UI (no active file), ignore.
        if (!activeFile) return;
        const f = openFiles.get(activeFile);
        if (!f) return;
        // Ignore echoes of load-markup (content matches last-saved exactly
        // AND matches our last-known content — i.e. nothing actually changed).
        if (d.content === f.content) return;
        f.content = d.content;
        f.dirty = (f.content !== f.lastSavedContent);
        renderTabs();
      }
    });

    // ----- file tree -------------------------------------------------------
    async function refreshTree() {
      const list = $('tree-list');
      list.innerHTML = '<li class="tree-empty">Loading…</li>';
      try {
        markups = await invoke('list_markups');
      } catch (e) {
        list.innerHTML = '<li class="tree-empty">Tauri commands unavailable<br/>(' + String(e) + ')</li>';
        setStatus('list_markups failed', 'err');
        return;
      }
      if (!markups.length) {
        list.innerHTML = '<li class="tree-empty">No markups yet.<br/>Click <strong>+ New</strong> to create one.</li>';
        setStatus('Ready — 0 markups', 'ok');
        return;
      }
      list.innerHTML = '';
      for (const name of markups) {
        const li = document.createElement('li');
        li.className = 'tree-item' + (name === activeFile ? ' active' : '');
        li.innerHTML = '<span class="glyph">&#128196;</span><span></span>';
        li.querySelector('span:last-child').textContent = name;
        li.addEventListener('click', () => openFile(name));
        list.appendChild(li);
      }
      setStatus('Ready — ' + markups.length + ' markup(s)', 'ok');
    }

    // ----- multi-file tabs (v3) -------------------------------------------
    // openFiles is the source of truth for what's open + dirty state. The
    // tab bar is rendered from it on every change. Activating a tab posts
    // its cached content to the editor iframe (no disk round-trip), which
    // makes tab switching instant and survives unsaved edits.
    function renderTabs() {
      const bar = $('tab-bar');
      bar.innerHTML = '';
      for (const [name, file] of openFiles) {
        const tab = document.createElement('div');
        tab.className = 'tab' + (name === activeFile ? ' active' : '');
        tab.title = name + (file.dirty ? ' (unsaved changes)' : '');

        const dot = document.createElement('span');
        dot.className = 'tab-dirty';
        dot.textContent = file.dirty ? '•' : '';
        tab.appendChild(dot);

        const nm = document.createElement('span');
        nm.className = 'tab-name';
        nm.textContent = name;
        tab.appendChild(nm);

        const x = document.createElement('span');
        x.className = 'tab-close';
        x.textContent = '×';
        x.title = 'Close';
        x.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(name);
        });
        tab.appendChild(x);

        tab.addEventListener('click', () => activateTab(name));
        bar.appendChild(tab);
      }
    }

    function activateTab(name) {
      const file = openFiles.get(name);
      if (!file) return;
      activeFile = name;
      // Push the cached content into the editor iframe. The plugin's
      // companion listener handles load-markup → textarea.value. Bumps
      // input event downstream; the markup-changed echo is filtered out
      // by the equality check in the message handler.
      postToEditor({ type: 'load-markup', content: file.content });
      $('editor-label').textContent = 'Editor — ' + name + (file.dirty ? ' •' : '');
      setActive(name);
      renderTabs();
      refreshTree(); // re-renders tree-item .active highlighting
    }

    function closeTab(name) {
      const file = openFiles.get(name);
      if (!file) return;
      if (file.dirty) {
        const ok = window.confirm('Discard unsaved changes to ' + name + '?');
        if (!ok) return;
      }
      openFiles.delete(name);
      if (activeFile === name) {
        // Pick the next available tab (last opened), or fall back to plugin UI.
        const remaining = Array.from(openFiles.keys());
        if (remaining.length) {
          activateTab(remaining[remaining.length - 1]);
        } else {
          activeFile = null;
          $('editor-label').textContent = 'Editor';
          setActive('plugin UI');
          renderTabs();
          refreshTree();
        }
      } else {
        renderTabs();
      }
    }

    async function openFile(name) {
      // If already open, just activate that tab.
      if (openFiles.has(name)) {
        activateTab(name);
        emitLog('info', 'switched to ' + name);
        return;
      }
      try {
        const content = await invoke('read_markup', { name });
        openFiles.set(name, {
          content: content,
          lastSavedContent: content,
          dirty: false,
        });
        activateTab(name);
        emitLog('info', 'opened ' + name);
      } catch (e) {
        setStatus('read_markup failed: ' + e, 'err');
      }
    }

    function showPlugin() {
      activeFile = null;
      $('editor-label').textContent = 'Editor';
      setActive('plugin UI');
      renderTabs();
      refreshTree();
    }

    async function newMarkup() {
      const raw = window.prompt('New markup filename (e.g. home.md):', 'untitled-' + Date.now() + '.md');
      if (!raw) return;
      const name = raw.trim();
      if (!name || /[\\/]/.test(name) || name.startsWith('.')) {
        alert('Invalid filename: no slashes, no leading dot.');
        return;
      }
      try {
        const seed = '# ' + name + '\n\n';
        await invoke('write_markup', { name, content: seed });
        await refreshTree();
        await openFile(name);
      } catch (e) {
        setStatus('write_markup failed: ' + e, 'err');
      }
    }

    async function saveActive() {
      if (!activeFile) {
        setStatus('Nothing to save — pick a file in the tree first', 'warn');
        return;
      }
      let payload;
      try {
        payload = await requestSaveFromEditor(activeFile, 2000);
      } catch (e) {
        setStatus('save failed: ' + e.message, 'err');
        return;
      }
      if (!payload || typeof payload.content !== 'string') {
        setStatus('save failed: empty response from editor', 'err');
        return;
      }
      try {
        await invoke('write_markup', { name: activeFile, content: payload.content });
        const f = openFiles.get(activeFile);
        if (f) {
          f.content = payload.content;
          f.lastSavedContent = payload.content;
          f.dirty = false;
          renderTabs();
          $('editor-label').textContent = 'Editor — ' + activeFile;
        }
        setStatus('Saved ' + activeFile + ' (' + payload.content.length + ' chars)', 'ok');
        emitLog('info', 'saved ' + activeFile);
      } catch (e) {
        setStatus('save failed: ' + e, 'err');
      }
    }

    // Save All: walks every dirty tab and persists its cached content.
    // The active tab is saved via the regular plugin round-trip so any
    // edits younger than the last markup-changed debounce window land too;
    // inactive tabs use the cached `content` directly (the plugin only
    // holds the active file). Status bar reports the count.
    async function saveAll() {
      // First, flush the active tab via the plugin (catches anything still
      // in the 200ms debounce window since the last markup-changed emit).
      if (activeFile) {
        try {
          const payload = await requestSaveFromEditor(activeFile, 2000);
          if (payload && typeof payload.content === 'string') {
            const f = openFiles.get(activeFile);
            if (f) f.content = payload.content;
          }
        } catch (e) {
          // Plugin not ready — fall back to whatever we have cached.
          emitLog('warn', 'saveAll: plugin save round-trip failed (' + e.message + '); using cached content');
        }
      }
      let saved = 0;
      let failed = 0;
      for (const [name, file] of openFiles) {
        if (!file.dirty && file.lastSavedContent === file.content) continue;
        try {
          await invoke('write_markup', { name, content: file.content });
          file.lastSavedContent = file.content;
          file.dirty = false;
          saved++;
        } catch (e) {
          failed++;
          emitLog('error', 'saveAll: ' + name + ' failed: ' + e);
        }
      }
      renderTabs();
      if (activeFile) {
        const f = openFiles.get(activeFile);
        if (f) $('editor-label').textContent = 'Editor — ' + activeFile + (f.dirty ? ' •' : '');
      }
      if (failed > 0) {
        setStatus('Saved ' + saved + ' file(s), ' + failed + ' failed', 'err');
      } else if (saved === 0) {
        setStatus('No dirty files to save', 'ok');
      } else {
        setStatus('Saved ' + saved + ' file(s)', 'ok');
      }
    }

    // ----- pane toggles ----------------------------------------------------
    function togglePane(which) {
      document.body.classList.toggle('hide-' + which);
    }

    // ----- canvas helpers --------------------------------------------------
    function reloadCanvas() {
      const f = $('canvas-frame');
      f.src = f.src; // eslint-disable-line no-self-assign
    }
    async function canvasOpenExternal() {
      try { await invoke('open_external', { url: 'http://localhost:9001/' }); }
      catch (_) { window.open('http://localhost:9001/', '_blank'); }
    }

    // ----- chat (host page → newcore) -------------------------------------
    function chatAppend(role, text, opts) {
      const empty = $('chat-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      if (opts && opts.label) {
        const tag = document.createElement('span');
        tag.className = 'role-tag';
        tag.textContent = opts.label;
        div.appendChild(tag);
        const body = document.createElement('span');
        body.textContent = text;
        div.appendChild(body);
      } else {
        div.textContent = text;
      }
      const logEl = $('chat-log');
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    function chatSetState(text, kind) {
      const el = $('chat-state');
      el.textContent = text;
      el.style.color = (kind === 'err') ? '#d26a6a' : (kind === 'ok' ? '#6ad28a' : '');
    }

    function chatSetSendEnabled(enabled) {
      $('chat-send').disabled = !enabled || chatInFlight;
    }

    async function chatLoadModels() {
      const sel = $('chat-model');
      const agentSel = $('agent-model');
      sel.disabled = true;
      sel.innerHTML = '<option value="">(loading models…)</option>';
      try {
        const r = await fetch(NEWCORE_BASE + '/info');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        chatModels = Array.isArray(j && j.models) ? j.models : [];
        sel.innerHTML = '';
        agentSel.innerHTML = '<option value="">(default)</option>';
        if (!chatModels.length) {
          const o = document.createElement('option');
          o.value = ''; o.textContent = '(no models)';
          sel.appendChild(o);
          chatSetState('no models', 'err');
          chatSetSendEnabled(false);
          return;
        }
        for (const m of chatModels) {
          const label = m.name ? (m.id + ' — ' + m.name) : m.id;
          const o = document.createElement('option');
          o.value = m.id; o.textContent = label;
          sel.appendChild(o);
          const o2 = document.createElement('option');
          o2.value = m.id; o2.textContent = label;
          agentSel.appendChild(o2);
        }
        // Prefer mock-default if present.
        const ids = chatModels.map(m => m.id);
        sel.value = ids.includes('mock-default') ? 'mock-default' : ids[0];
        sel.disabled = false;
        chatSetState('connected', 'ok');
        chatSetSendEnabled(true);
      } catch (e) {
        sel.innerHTML = '<option value="">(failed to load)</option>';
        chatSetState('newcore unreachable', 'err');
        chatSetSendEnabled(false);
      }
    }

    async function chatSend() {
      if (chatInFlight) return;
      const text = $('chat-input').value.trim();
      if (!text) return;
      const model = $('chat-model').value;
      if (!model) { chatAppend('error', 'Pick a model first.'); return; }
      chatAppend('user', text, { label: 'you' });
      $('chat-input').value = '';
      chatInFlight = true;
      chatSetSendEnabled(false);
      const pending = chatAppend('system', '…thinking');
      try {
        const r = await fetch(NEWCORE_BASE + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, message: text }),
        });
        if (!r.ok) {
          let detail = 'HTTP ' + r.status;
          try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch (_) {}
          pending.remove();
          chatAppend('error', detail);
          return;
        }
        const j = await r.json();
        const content = (j && typeof j.content === 'string') ? j.content : JSON.stringify(j);
        const usage = j && j.usage;
        const tail = usage ? ('\n\n— ' + (usage.totalTokens || 0) + ' tokens') : '';
        pending.remove();
        chatAppend('assistant', content + tail, { label: (j && j.model) || model });
      } catch (e) {
        pending.remove();
        chatAppend('error', 'fetch failed: ' + (e && e.message || String(e)));
      } finally {
        chatInFlight = false;
        chatSetSendEnabled(true);
        $('chat-input').focus();
      }
    }

    function chatClear() {
      const logEl = $('chat-log');
      logEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'chat-empty';
      empty.id = 'chat-empty';
      empty.textContent = 'Talk to newcore. Pick a model and send a message.';
      logEl.appendChild(empty);
    }

    // ----- agent (Agent menu) ---------------------------------------------
    function showAgentModal() {
      $('agent-task').value = '';
      $('agent-modal').classList.add('show');
      setTimeout(() => $('agent-task').focus(), 30);
    }
    function hideAgentModal() {
      $('agent-modal').classList.remove('show');
    }

    async function agentLaunch() {
      const task = $('agent-task').value.trim();
      if (!task) { $('agent-task').focus(); return; }
      const model = $('agent-model').value;
      hideAgentModal();
      setAgentState('spawning…');
      try {
        const r = await fetch(NEWCORE_BASE + '/agents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(model ? { task, model } : { task }),
        });
        if (!r.ok) {
          let detail = 'HTTP ' + r.status;
          try { const j = await r.json(); detail += ' — ' + (j.error || ''); } catch (_) {}
          setAgentState('spawn failed: ' + detail, 'err');
          chatAppend('error', 'agent spawn failed: ' + detail);
          return;
        }
        const resp = await r.json();
        if (!resp || !resp.id) {
          setAgentState('no id returned', 'err');
          chatAppend('error', 'agent spawned without id: ' + JSON.stringify(resp));
          return;
        }
        agentPollId = resp.id;
        agentPollStartedAt = Date.now();
        chatAppend('system', 'spawned agent ' + resp.id + ' — polling every ' + AGENT_POLL_MS + 'ms');
        setAgentState('polling ' + resp.id.slice(0, 8) + '…');
        schedulePoll();
      } catch (e) {
        setAgentState('spawn failed', 'err');
        chatAppend('error', 'agent fetch failed: ' + (e && e.message || String(e)));
      }
    }

    function schedulePoll() {
      if (agentPollTimer) clearTimeout(agentPollTimer);
      agentPollTimer = setTimeout(pollAgentOnce, AGENT_POLL_MS);
    }

    async function pollAgentOnce() {
      if (!agentPollId) return;
      const id = agentPollId;
      if (Date.now() - agentPollStartedAt > AGENT_POLL_TIMEOUT_MS) {
        setAgentState('poll timeout', 'err');
        chatAppend('error', 'agent ' + id + ' poll timed out (continues server-side)');
        agentPollId = null;
        return;
      }
      try {
        const r = await fetch(NEWCORE_BASE + '/agents/' + encodeURIComponent(id));
        if (!r.ok) {
          setAgentState('poll HTTP ' + r.status, 'err');
          chatAppend('error', 'agent poll failed: HTTP ' + r.status);
          agentPollId = null;
          return;
        }
        const s = await r.json();
        const state = (s && s.status && s.status.state) || s.state || 'unknown';
        const step = (s && s.status && s.status.currentStep) || 0;
        const total = (s && s.status && s.status.totalSteps) || 0;
        const progress = total ? (step + '/' + total) : ('step ' + step);
        const kind = (state === 'completed') ? 'ok' : ((state === 'failed' || state === 'cancelled') ? 'err' : '');
        setAgentState(state + ' · ' + progress, kind);
        if (state === 'completed' || state === 'failed' || state === 'cancelled') {
          const detail = (s && s.result && (s.result.summary || s.result.error)) || '';
          const role = (state === 'completed') ? 'assistant'
                     : (state === 'cancelled') ? 'system' : 'error';
          chatAppend(role,
                     'agent ' + id + ' ' + state + (detail ? ('\n\n' + detail) : ''),
                     { label: 'agent' });
          agentPollId = null;
          return;
        }
        schedulePoll();
      } catch (e) {
        setAgentState('poll error', 'err');
        chatAppend('error', 'agent poll error: ' + (e && e.message || String(e)));
        agentPollId = null;
      }
    }

    // Stop button: cancels the active agent server-side via newcore's
    // /agents/:id/cancel endpoint (v3), then stops polling either way.
    async function agentStop() {
      if (!agentPollId) {
        setAgentState('idle');
        return;
      }
      const id = agentPollId;
      // Stop polling first — we'll surface the cancel result independently.
      agentPollId = null;
      if (agentPollTimer) { clearTimeout(agentPollTimer); agentPollTimer = null; }
      try {
        const r = await fetch(NEWCORE_BASE + '/agents/' + encodeURIComponent(id) + '/cancel', {
          method: 'POST',
        });
        if (r.ok) {
          let body = null;
          try { body = await r.json(); } catch (_) {}
          const state = body && body.state ? body.state : 'unknown';
          if (body && body.ok && state === 'cancelled') {
            setAgentState('cancelled', 'ok');
            chatAppend('system', 'Agent cancelled.');
          } else if (body && body.ok) {
            // Cancel accepted but not yet observed in the run loop — likely
            // mid-step. State will flip to 'cancelled' on the next boundary.
            setAgentState('cancelling…');
            chatAppend('system', 'Agent cancelled.');
          } else {
            // ok:false → agent was already in a terminal state. Honest signal.
            setAgentState('idle');
            chatAppend('system', 'Agent already ' + state + ' (nothing to cancel).');
          }
        } else if (r.status === 404) {
          // Endpoint exists but agent unknown (or endpoint missing on older
          // newcore). Either way, polling stopped is the right behavior.
          let detail = 'HTTP 404';
          try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch (_) {}
          setAgentState('polling stopped — run may continue server-side');
          chatAppend('system', 'stopped polling agent ' + id + ' — cancel returned ' + detail);
        } else {
          let detail = 'HTTP ' + r.status;
          try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch (_) {}
          setAgentState('polling stopped — run may continue server-side');
          chatAppend('system', 'stopped polling agent ' + id + ' — cancel failed: ' + detail);
        }
      } catch (e) {
        // Network failure: be honest the run may still be alive server-side.
        setAgentState('polling stopped — run may continue server-side');
        chatAppend('system', 'stopped polling agent ' + id + ' — cancel fetch failed: ' + (e && e.message || String(e)));
      }
    }

    // ----- Tauri event wiring ---------------------------------------------
    async function wireMenu() {
      if (!TAURI) return;
      await listen('menu-new-markup',     () => newMarkup());
      await listen('menu-save',           () => saveActive());
      await listen('menu-save-all',       () => saveAll());
      await listen('menu-open-workspace', () => canvasOpenExternal());
      await listen('toggle-pane',         (e) => togglePane(e.payload));
      await listen('agent-start',         () => showAgentModal());
      await listen('agent-stop',          () => agentStop());
      await listen('show-about',          () => alert('Antigravity IDE v0.2 — native desktop shell for Penpot + agent markup editor + chat.'));
      await listen('agent-log',           (e) => {
        const p = e.payload || {};
        setStatus('[' + (p.level || 'log') + '] ' + (p.message || ''),
                  p.level === 'error' ? 'err' : (p.level === 'warn' ? 'warn' : 'ok'));
      });
      await listen('open-penpot', (e) => {
        const p = e.payload || {};
        if (p.project_id && p.file_id) {
          const url = 'http://localhost:9001/#/workspace/' + p.project_id + '/' + p.file_id;
          $('canvas-frame').src = url;
          setStatus('Navigated canvas to file ' + p.file_id, 'ok');
        }
      });
    }

    // ----- boot ------------------------------------------------------------
    $('btn-refresh').addEventListener('click', refreshTree);
    $('btn-new').addEventListener('click', newMarkup);
    $('btn-save').addEventListener('click', saveActive);
    $('btn-save-all').addEventListener('click', saveAll);
    $('btn-show-plugin').addEventListener('click', showPlugin);
    $('btn-reload-canvas').addEventListener('click', reloadCanvas);
    $('btn-canvas-fullscreen').addEventListener('click', canvasOpenExternal);

    $('chat-send').addEventListener('click', chatSend);
    $('chat-clear').addEventListener('click', chatClear);
    $('chat-retry').addEventListener('click', chatLoadModels);
    $('chat-input').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        chatSend();
      }
    });

    $('agent-cancel').addEventListener('click', hideAgentModal);
    $('agent-launch').addEventListener('click', agentLaunch);
    $('agent-modal').addEventListener('click', (e) => {
      if (e.target === $('agent-modal')) hideAgentModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('agent-modal').classList.contains('show')) hideAgentModal();
      // Save All: Alt+Cmd+S / Alt+Ctrl+S. (Plain Cmd+S is already handled by
      // the native menu accelerator → menu-save event.)
      if ((e.metaKey || e.ctrlKey) && e.altKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        saveAll();
      }
    });

    (async () => {
      setStatus(TAURI ? 'Tauri OK — connecting to backend…' : 'Browser preview (no Tauri)', TAURI ? 'ok' : 'warn');
      await wireMenu();
      await refreshTree();
      chatLoadModels();
    })();
  </script>
</body>
</html>
