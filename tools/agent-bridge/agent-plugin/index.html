<!-- Phase 4 Agent Chat — talks to newcore on :3777                   -->
<!-- Owned by the agent-pane sub-agent. Does NOT touch the WS tool   -->
<!-- proxy code above (that's sub-agent F's territory). The only     -->
<!-- shared surface with the Phase 2 pipeline is `localStorage` —    -->
<!-- different keys, no overlap.                                     -->
<!-- ─────────────────────────────────────────────────────────────── -->
<script type="module">
'use strict';

/* ── Phase 4 Agent Chat ── */

const NEWCORE_BASE = 'http://localhost:3777';
const STORAGE_KEY  = 'agent-bridge-chat:v1';
const MODEL_KEY    = 'agent-bridge-chat:v1:model';
const MODE_KEY     = 'agent-bridge-chat:v1:mode';
const MAX_MESSAGES = 100;
const POLL_INTERVAL_MS = 500;
const POLL_TIMEOUT_MS  = 5 * 60 * 1000; // 5min hard cap so a stuck agent doesn't poll forever
const PENPOT_TOOL_PREFIX = 'penpot.';

// ── Element lookups ──
const $log       = document.getElementById('agent-log');
const $input     = document.getElementById('agent-input');
const $send      = document.getElementById('agent-send');
const $stop      = document.getElementById('agent-stop');
const $clear     = document.getElementById('agent-clear');
const $modeChat  = document.getElementById('mode-chat');
const $modeAgent = document.getElementById('mode-agent');
const $model     = document.getElementById('agent-model');
const $banner    = document.getElementById('agent-banner');
const $bannerTxt = document.getElementById('agent-banner-text');
const $retry     = document.getElementById('agent-retry');
const $modalBg   = document.getElementById('agent-modal-bg');
const $modalTitle= document.getElementById('agent-modal-title-text');
const $modalMeta = document.getElementById('agent-modal-meta');
const $modalBody = document.getElementById('agent-modal-content');
const $modalClose= document.getElementById('agent-modal-close');

// ── State ──
let mode = 'chat';      // 'chat' | 'agent'
let healthy = false;    // can we reach newcore?
let inFlight = false;
let chatAbort = null;   // AbortController for the in-flight /chat
let pollTimer = null;   // setTimeout handle for the next /agents/:id poll
let pollAgentId = null; // the agent we're polling, if any
let pollStartedAt = 0;
let lastFocusBeforeModal = null;

// Persisted message log: [{role, content, mode, ts, steps?, artifacts?, error?}]
let messages = loadMessages();

// ── localStorage helpers ──────────────────────────────────────────
function loadMessages() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(-MAX_MESSAGES) : [];
  } catch { return []; }
}
function saveMessages() {
  try {
    // Trim before persisting.
    if (messages.length > MAX_MESSAGES) messages = messages.slice(-MAX_MESSAGES);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
  } catch (e) {
    // localStorage can fail in sandboxed iframes — degrade gracefully.
    console.warn('[agent-chat] localStorage save failed:', e && e.message);
  }
}
function loadString(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
}
function saveString(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

// ── Rendering ─────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Tiny markdown-ish renderer: ` ` → <code>, **bold** → <strong>. Conservative
// on purpose — we don't want to interpret agent output as HTML.
function renderInline(text) {
  const html = escapeHtml(text)
    .replace(/`([^`\n]+)`/g, (_, m) => '<code>' + m + '</code>');
  return html;
}

function renderEmpty() {
  $log.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = 'No messages yet. Type a prompt below to start chatting with newcore.';
  $log.appendChild(empty);
}

function renderAll() {
  $log.innerHTML = '';
  if (!messages.length) { renderEmpty(); return; }
  for (const m of messages) renderMessage(m);
  scrollToBottom();
}

function renderMessage(m) {
  // First-time render: remove the empty state if present.
  const emptyEl = $log.querySelector('.empty');
  if (emptyEl) emptyEl.remove();

  const el = document.createElement('div');
  el.className = 'msg ' + (m.kind || m.role || 'system');
  el.dataset.mid = m.id || '';

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = labelFor(m);
  el.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'body';
  if (m.kind === 'thinking') {
    body.textContent = m.content || 'Thinking…';
  } else {
    body.innerHTML = renderInline(m.content || '');
  }
  el.appendChild(body);

  if (m.steps && m.steps.length) renderSteps(el, m.steps);
  if (m.artifacts && m.artifacts.length) renderArtifacts(el, m.artifacts, m.agentId);

  $log.appendChild(el);
  return el;
}

function labelFor(m) {
  if (m.kind === 'thinking') return 'agent · ' + (m.state || 'thinking') + (m.totalSteps ? ' (' + (m.currentStep || 0) + '/' + m.totalSteps + ')' : '');
  if (m.kind === 'error') return 'error';
  if (m.kind === 'system') return 'system';
  if (m.role === 'user') return 'you' + (m.mode === 'agent' ? ' · task' : '');
  if (m.role === 'assistant') return (m.mode === 'agent' ? 'agent' : 'assistant') + (m.model ? ' · ' + m.model : '');
  return m.role || '';
}

function renderSteps(parentEl, steps) {
  const wrap = document.createElement('div');
  wrap.className = 'steps';
  for (const s of steps) {
    const row = document.createElement('div');
    row.className = 'step';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = '#' + s.id;
    row.appendChild(num);

    if (s.tool && s.tool.startsWith(PENPOT_TOOL_PREFIX)) {
      const badge = document.createElement('span');
      badge.className = 'tool-badge';
      badge.title = 'Penpot tool call';
      badge.textContent = '🔧 ' + s.tool;
      row.appendChild(badge);
    } else if (s.tool) {
      const badge = document.createElement('span');
      badge.className = 'tool-badge';
      badge.style.color = '#aaa';
      badge.style.background = '#1f1f1f';
      badge.style.borderColor = '#333';
      badge.textContent = s.tool;
      row.appendChild(badge);
    }

    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = s.description || '';
    row.appendChild(desc);

    const status = document.createElement('span');
    status.className = 'status ' + (s.status || 'pending');
    status.textContent = s.status || 'pending';
    row.appendChild(status);

    wrap.appendChild(row);
  }
  parentEl.appendChild(wrap);
}

function renderArtifacts(parentEl, artifacts, agentId) {
  const wrap = document.createElement('div');
  wrap.className = 'artifacts';
  for (const a of artifacts) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'artifact-btn';
    const type = document.createElement('span');
    type.className = 'type';
    type.textContent = a.type || 'artifact';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = a.title || a.id || '(untitled)';
    btn.appendChild(type);
    btn.appendChild(title);
    btn.addEventListener('click', () => openArtifactModal(a));
    wrap.appendChild(btn);
  }
  parentEl.appendChild(wrap);
}

function scrollToBottom() {
  // Only auto-scroll if the user is already near the bottom (don't yank them).
  const nearBottom = ($log.scrollHeight - $log.scrollTop - $log.clientHeight) < 80;
  if (nearBottom) $log.scrollTop = $log.scrollHeight;
}

function pushMessage(m) {
  m.ts = m.ts || Date.now();
  m.id = m.id || ('m-' + m.ts + '-' + Math.random().toString(36).slice(2, 6));
  messages.push(m);
  if (messages.length > MAX_MESSAGES) messages = messages.slice(-MAX_MESSAGES);
  renderMessage(m);
  saveMessages();
  scrollToBottom();
  return m;
}

function updateMessage(id, patch) {
  const idx = messages.findIndex(m => m.id === id);
  if (idx < 0) return null;
  Object.assign(messages[idx], patch);
  // Re-render that single message in place.
  const oldEl = $log.querySelector('[data-mid="' + id + '"]');
  if (oldEl) {
    const newEl = (function() {
      // Build a detached element using renderMessage but without appending —
      // easiest path: render & then swap.
      const tmpParent = document.createElement('div');
      // Use a clone approach: temporarily detach, render, take the last child.
      $log.appendChild(tmpParent);
      const beforeCount = $log.children.length;
      renderMessage(messages[idx]);
      // The new element was appended to $log; move it before oldEl and remove tmp + old.
      const appended = $log.lastChild;
      tmpParent.remove();
      return appended;
    })();
    $log.insertBefore(newEl, oldEl);
    oldEl.remove();
  }
  saveMessages();
  scrollToBottom();
  return messages[idx];
}

function removeMessage(id) {
  const idx = messages.findIndex(m => m.id === id);
  if (idx < 0) return;
  messages.splice(idx, 1);
  const el = $log.querySelector('[data-mid="' + id + '"]');
  if (el) el.remove();
  saveMessages();
  if (!messages.length) renderEmpty();
}

// ── Health + models bootstrap ─────────────────────────────────────
async function checkHealth() {
  showBanner('Checking newcore…', false);
  try {
    const r = await fetch(NEWCORE_BASE + '/health', { method: 'GET' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j && j.status === 'ok') {
      healthy = true;
      hideBanner();
      await loadModels();
      updateSendDisabled();
      return true;
    }
    throw new Error('unexpected health response');
  } catch (e) {
    healthy = false;
    $model.disabled = true;
    showBanner(
      'newcore not reachable at :3777 — is it running? Try: ' +
      'cd ~/coding-agents/repos/open-antigravity/newcore && npm run server',
      true
    );
    updateSendDisabled();
    return false;
  }
}

async function loadModels() {
  try {
    const r = await fetch(NEWCORE_BASE + '/info');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const models = Array.isArray(j && j.models) ? j.models : [];
    const remembered = loadString(MODEL_KEY, '');
    $model.innerHTML = '';
    if (!models.length) {
      const o = document.createElement('option');
      o.value = ''; o.textContent = '(no models)';
      $model.appendChild(o);
      $model.disabled = true;
      return;
    }
    for (const m of models) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name ? (m.id + ' — ' + m.name) : m.id;
      $model.appendChild(o);
    }
    // Pick the remembered model if still available; else default to 'mock-default' if present; else first.
    const ids = models.map(m => m.id);
    let pick = remembered && ids.includes(remembered) ? remembered
             : ids.includes('mock-default') ? 'mock-default'
             : ids[0];
    $model.value = pick;
    saveString(MODEL_KEY, pick);
    $model.disabled = false;
  } catch (e) {
    $model.innerHTML = '<option value="">(failed to load)</option>';
    $model.disabled = true;
  }
}

function showBanner(text, isError) {
  $bannerTxt.textContent = text;
  $banner.classList.add('show');
  $banner.style.background = isError ? '#3a1f1f' : '#2a2230';
  $banner.style.color      = isError ? '#ffb4b4' : '#d8c7ff';
}
function hideBanner() {
  $banner.classList.remove('show');
}

function updateSendDisabled() {
  const canSend = healthy && !inFlight && ($model.value || mode === 'agent');
  // For chat mode we strictly need a model id (the /chat endpoint requires it
  // per the body shape we send). Agent mode also picks up the same model id,
  // and newcore will fall back to its default if we omit it.
  $send.disabled = !canSend;
  $input.disabled = !healthy;
}

// ── Mode switching ────────────────────────────────────────────────
function setMode(next) {
  mode = next;
  $modeChat.classList.toggle('active', next === 'chat');
  $modeAgent.classList.toggle('active', next === 'agent');
  $modeChat.setAttribute('aria-selected', next === 'chat');
  $modeAgent.setAttribute('aria-selected', next === 'agent');
  $input.placeholder = (next === 'agent')
    ? 'Describe a task for the agent… (Cmd+Enter to send)'
    : 'Ask the agent… (Cmd+Enter to send)';
  $stop.title = (next === 'agent')
    ? 'Stop polling (the agent continues server-side — newcore has no /agents/:id/cancel yet)'
    : 'Cancel the in-flight request';
  saveString(MODE_KEY, next);
}
$modeChat.addEventListener('click',  () => setMode('chat'));
$modeAgent.addEventListener('click', () => setMode('agent'));

// ── Sending ───────────────────────────────────────────────────────
function setInFlight(on) {
  inFlight = on;
  $stop.classList.toggle('hidden', !on);
  updateSendDisabled();
}

async function sendCurrent() {
  if (inFlight || !healthy) return;
  const text = ($input.value || '').trim();
  if (!text) return;

  const chosenModel = $model.value || 'mock-default';
  saveString(MODEL_KEY, chosenModel);

  pushMessage({ role: 'user', kind: 'user', mode, content: text });
  $input.value = '';
  setInFlight(true);

  if (mode === 'chat') {
    await doChat(text, chosenModel);
  } else {
    await doAgent(text, chosenModel);
  }
}

async function doChat(message, model) {
  chatAbort = new AbortController();
  try {
    const r = await fetch(NEWCORE_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, message }),
      signal: chatAbort.signal,
    });
    if (!r.ok) {
      let detail = 'HTTP ' + r.status;
      try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch {}
      pushMessage({ role: 'assistant', kind: 'error', mode: 'chat', content: detail });
      return;
    }
    const j = await r.json();
    const content = (j && typeof j.content === 'string') ? j.content : JSON.stringify(j);
    const usage = j && j.usage;
    const tail = usage ? ('\n\n— ' + (usage.totalTokens || 0) + ' tokens') : '';
    pushMessage({
      role: 'assistant', kind: 'assistant', mode: 'chat',
      model: j && j.model || model,
      content: content + tail,
    });
  } catch (e) {
    if (e && e.name === 'AbortError') {
      pushMessage({ role: 'assistant', kind: 'system', content: '(cancelled)' });
    } else {
      pushMessage({ role: 'assistant', kind: 'error', mode: 'chat',
                    content: friendlyFetchError(e) });
    }
  } finally {
    chatAbort = null;
    setInFlight(false);
  }
}

async function doAgent(task, model) {
  let resp;
  try {
    const r = await fetch(NEWCORE_BASE + '/agents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, model }),
    });
    if (!r.ok) {
      let detail = 'HTTP ' + r.status;
      try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch {}
      pushMessage({ role: 'assistant', kind: 'error', mode: 'agent', content: detail });
      setInFlight(false);
      return;
    }
    resp = await r.json();
  } catch (e) {
    pushMessage({ role: 'assistant', kind: 'error', mode: 'agent',
                  content: friendlyFetchError(e) });
    setInFlight(false);
    return;
  }

  pollAgentId = resp && resp.id;
  if (!pollAgentId) {
    pushMessage({ role: 'assistant', kind: 'error', mode: 'agent',
                  content: 'Agent spawned but no id was returned: ' + JSON.stringify(resp) });
    setInFlight(false);
    return;
  }

  // Live "thinking" message we update in place.
  const thinking = pushMessage({
    kind: 'thinking', mode: 'agent',
    state: (resp.status && resp.status.state) || 'starting',
    currentStep: (resp.status && resp.status.currentStep) || 0,
    totalSteps:  (resp.status && resp.status.totalSteps)  || 0,
    content: 'Spawning agent ' + pollAgentId + '…',
    agentId: pollAgentId,
  });

  pollStartedAt = Date.now();
  schedulePoll(thinking.id, pollAgentId);
}

function schedulePoll(thinkingId, agentId) {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(() => pollOnce(thinkingId, agentId), POLL_INTERVAL_MS);
}

async function pollOnce(thinkingId, agentId) {
  // If user clicked Stop, the in-flight flag is cleared and we just bail.
  if (!inFlight || pollAgentId !== agentId) return;

  // Hard timeout guard.
  if (Date.now() - pollStartedAt > POLL_TIMEOUT_MS) {
    updateMessage(thinkingId, {
      kind: 'error', content: 'Agent polling timed out after ' + Math.round(POLL_TIMEOUT_MS/1000) + 's. ' +
                              'Agent ' + agentId + ' may still be running server-side.',
    });
    stopPolling();
    return;
  }

  let status;
  try {
    const r = await fetch(NEWCORE_BASE + '/agents/' + encodeURIComponent(agentId));
    if (!r.ok) {
      // 404 means the agent vanished. Show as error and stop.
      let detail = 'HTTP ' + r.status;
      try { const j = await r.json(); detail += ' — ' + (j.error || ''); } catch {}
      updateMessage(thinkingId, { kind: 'error', content: 'Agent status check failed: ' + detail });
      stopPolling();
      return;
    }
    status = await r.json();
  } catch (e) {
    // Connection dropped mid-run. Surface and stop.
    updateMessage(thinkingId, { kind: 'error', content: 'Lost connection while polling: ' + friendlyFetchError(e) });
    stopPolling();
    return;
  }

  // Update in-place thinking bubble with progress.
  updateMessage(thinkingId, {
    state: status.state,
    currentStep: status.currentStep || 0,
    totalSteps:  status.totalSteps  || 0,
    content: 'Agent ' + agentId + ' — ' + status.state +
             ((status.totalSteps || 0) ? (' (step ' + (status.currentStep || 0) + '/' + status.totalSteps + ')') : '') +
             (status.error ? ('\n' + status.error) : ''),
  });

  if (status.state === 'completed' || status.state === 'failed' || status.state === 'cancelled') {
    await finalizeAgent(thinkingId, agentId, status);
    stopPolling();
    return;
  }

  // Keep going.
  schedulePoll(thinkingId, agentId);
}

async function finalizeAgent(thinkingId, agentId, status) {
  // Fetch artifacts to build the final assistant message.
  let arts = [];
  try {
    const r = await fetch(NEWCORE_BASE + '/artifacts/' + encodeURIComponent(agentId));
    if (r.ok) arts = await r.json();
  } catch { /* non-fatal — we'll still show the summary */ }

  // Synthesise steps from the artifact log entries.
  const stepLogs = arts.filter(a => a && a.type === 'log');
  const planArt = arts.find(a => a && a.type === 'execution_plan');
  const verifyArt = arts.find(a => a && a.type === 'verification');

  let plan = null;
  if (planArt) {
    try { plan = JSON.parse(planArt.content); } catch { plan = null; }
  }
  const steps = (plan && Array.isArray(plan.steps)) ? plan.steps.map(p => {
    // Find a matching log entry to grab status.
    const log = stepLogs.find(l => l.title && l.title.startsWith('Step ' + p.id + ':'));
    let st = 'pending';
    if (log && /Status:\s*(\w+)/i.test(log.content)) {
      st = log.content.match(/Status:\s*(\w+)/i)[1].toLowerCase();
    }
    return {
      id: p.id,
      description: p.description || '',
      tool: p.tool || '',
      status: st,
    };
  }) : [];

  // Pull a short summary out of the verification report if we have one.
  let summary = '';
  if (verifyArt && verifyArt.content) {
    const lines = verifyArt.content.split('\n').slice(0, 6).join('\n');
    summary = lines;
  } else {
    summary = 'Agent ' + status.state + (status.error ? (': ' + status.error) : '.');
  }

  // Convert the artifact list into clickable items for the message.
  const artLinks = arts.map(a => ({
    id: a.id, type: a.type, title: a.title, content: a.content, metadata: a.metadata,
  }));

  updateMessage(thinkingId, {
    kind: (status.state === 'completed') ? 'assistant' : 'error',
    role: 'assistant',
    mode: 'agent',
    model: status.model,
    agentId,
    content: summary,
    steps,
    artifacts: artLinks,
  });
}

function stopPolling() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  pollAgentId = null;
  setInFlight(false);
}

// ── Stop button ──────────────────────────────────────────────────
$stop.addEventListener('click', () => {
  if (mode === 'chat') {
    if (chatAbort) chatAbort.abort();
  } else {
    // Agent mode: stop polling. Agent continues server-side.
    if (pollAgentId) {
      pushMessage({
        kind: 'system',
        content: 'Stopped polling agent ' + pollAgentId + '. (The run continues server-side — newcore has no /agents/:id/cancel yet.)',
      });
    }
    stopPolling();
  }
});

// ── Send / keyboard ──────────────────────────────────────────────
$send.addEventListener('click', sendCurrent);
$input.addEventListener('keydown', (e) => {
  // Cmd+Enter / Ctrl+Enter sends.
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    sendCurrent();
  }
});

// ── Clear ────────────────────────────────────────────────────────
$clear.addEventListener('click', () => {
  // If a chat is in flight, abort it; if polling, stop it.
  if (chatAbort) { try { chatAbort.abort(); } catch {} }
  stopPolling();
  messages = [];
  saveMessages();
  renderEmpty();
});

// ── Retry banner button ───────────────────────────────────────────
$retry.addEventListener('click', checkHealth);

// ── Modal ─────────────────────────────────────────────────────────
function openArtifactModal(a) {
  $modalTitle.textContent = a.title || a.id || 'Artifact';
  const bits = [];
  if (a.type) bits.push(a.type);
  if (a.metadata && typeof a.metadata === 'object') {
    for (const [k, v] of Object.entries(a.metadata)) bits.push(k + '=' + v);
  }
  $modalMeta.textContent = bits.join(' · ');
  // Pretty-print JSON artifacts; pass-through everything else.
  let body = a.content || '';
  if (typeof body === 'string' && body.trim().startsWith('{')) {
    try { body = JSON.stringify(JSON.parse(body), null, 2); } catch {}
  }
  $modalBody.textContent = body || '(empty)';
  lastFocusBeforeModal = document.activeElement;
  $modalBg.hidden = false;
  $modalBg.classList.add('show');
  // Move focus into the dialog for keyboard users.
  $modalClose.focus();
}
function closeArtifactModal() {
  $modalBg.classList.remove('show');
  $modalBg.hidden = true;
  if (lastFocusBeforeModal && typeof lastFocusBeforeModal.focus === 'function') {
    try { lastFocusBeforeModal.focus(); } catch {}
  }
  lastFocusBeforeModal = null;
}
$modalClose.addEventListener('click', closeArtifactModal);
$modalBg.addEventListener('click', (e) => { if (e.target === $modalBg) closeArtifactModal(); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $modalBg.classList.contains('show')) closeArtifactModal();
});

// ── Model dropdown change ────────────────────────────────────────
$model.addEventListener('change', () => saveString(MODEL_KEY, $model.value));

// ── Pretty errors for fetch failures ─────────────────────────────
function friendlyFetchError(e) {
  const msg = (e && e.message) || String(e);
  if (/failed to fetch|networkerror|load failed/i.test(msg)) {
    return 'newcore not reachable at :3777 — is it running? Try: ' +
           'cd ~/coding-agents/repos/open-antigravity/newcore && npm run server';
  }
  return msg;
}

// ── Boot ──────────────────────────────────────────────────────────
setMode(loadString(MODE_KEY, 'chat'));
renderAll();
checkHealth();
</script>

<!-- ─────────────────────────────────────────────────────────────── -->
<!-- Phase 6 Inline Write (Cmd+I) — Cursor-style AI rewrites for the -->
<!-- markup textarea AND the chat input. Shares newcore's /chat      -->
<!-- endpoint (same contract as Phase 4). Independent of Phase 4's   -->
<!-- conversation log: rewrites are inline, not chat turns.          -->
<!-- ─────────────────────────────────────────────────────────────── -->
<script type="module">
'use strict';

/* ── Phase 6 Inline Write (Cmd+I) ── */

const NEWCORE_BASE = 'http://localhost:3777';
const CMDI_MODEL_KEY = 'agent-bridge-chat:v1:cmdi-model';
const CHAT_MODEL_KEY = 'agent-bridge-chat:v1:model';

// Source-of-truth elements we hook into.
const $markupArea = document.getElementById('markup-area');
const $chatInput  = document.getElementById('agent-input');
const $chatModel  = document.getElementById('agent-model');

// One shared panel reused for both markup and chat modes. We build it once,
// then re-position/re-parameterize on each open.
const panel = document.createElement('div');
panel.className = 'cmdi-panel';
panel.setAttribute('role', 'dialog');
panel.setAttribute('aria-modal', 'false');
panel.setAttribute('aria-label', 'Inline AI write');
panel.hidden = true;
panel.innerHTML = `
  <div class="cmdi-row">
    <span class="cmdi-label">Cmd+I</span>
    <span class="cmdi-mode-pill" id="cmdi-mode-pill">markup</span>
    <span class="cmdi-spacer"></span>
    <label class="sr-only" for="cmdi-model">Model</label>
    <select class="cmdi-model" id="cmdi-model" aria-label="Model selection">
      <option value="">(loading…)</option>
    </select>
    <span class="cmdi-esc"><kbd>Esc</kbd></span>
  </div>
  <textarea class="cmdi-input" id="cmdi-input" rows="2"
    placeholder="Write or edit DSL…"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="cmdi-row">
    <span class="cmdi-status" id="cmdi-status"></span>
    <span class="cmdi-spacer"></span>
    <button type="button" class="cmdi-send" id="cmdi-send"
      title="Send (Cmd+Enter)">Send</button>
  </div>
`;
document.body.appendChild(panel);

const $cmdiModePill = panel.querySelector('#cmdi-mode-pill');
const $cmdiModel    = panel.querySelector('#cmdi-model');
const $cmdiInput    = panel.querySelector('#cmdi-input');
const $cmdiSend     = panel.querySelector('#cmdi-send');
const $cmdiStatus   = panel.querySelector('#cmdi-status');

// ── State ──
let cmdiOpen = false;
let cmdiMode = null;        // 'markup' | 'chat'
let cmdiSource = null;      // the textarea we opened from
let cmdiSelStart = 0;       // captured selection at open time
let cmdiSelEnd = 0;
let cmdiContext = '';       // the text that will be rewritten
let cmdiAbort = null;
let cmdiLastFocus = null;

// ── Model dropdown ──
// Mirror the chat pane's <select id="agent-model"> options. We re-sync on
// every open so newly-discovered models (claude-cli/*, litellm/*, etc.) flow
// through automatically. Persist our own last-pick under CMDI_MODEL_KEY so
// the user's Cmd+I model can differ from their chat model.
function syncCmdiModels() {
  const current = $cmdiModel.value;
  $cmdiModel.innerHTML = '';
  const opts = Array.from($chatModel.options);
  if (!opts.length || ($chatModel.disabled && (!opts[0] || !opts[0].value))) {
    const o = document.createElement('option');
    o.value = '';
    o.textContent = $chatModel.disabled ? '(no models — newcore offline?)' : '(loading…)';
    $cmdiModel.appendChild(o);
    $cmdiModel.disabled = true;
    return;
  }
  for (const opt of opts) {
    if (!opt.value) continue; // skip placeholder rows
    const o = document.createElement('option');
    o.value = opt.value;
    o.textContent = opt.textContent;
    $cmdiModel.appendChild(o);
  }
  $cmdiModel.disabled = false;

  // Picking order: remembered cmdi-model → previously-displayed value → chat
  // pane's current selection → first option.
  let remembered = '';
  try { remembered = localStorage.getItem(CMDI_MODEL_KEY) || ''; } catch {}
  const available = Array.from($cmdiModel.options).map(o => o.value);
  let pick = '';
  if (remembered && available.includes(remembered)) pick = remembered;
  else if (current && available.includes(current))  pick = current;
  else if ($chatModel.value && available.includes($chatModel.value)) pick = $chatModel.value;
  else pick = available[0] || '';
  $cmdiModel.value = pick;
}

// Save user's pick whenever it changes.
$cmdiModel.addEventListener('change', () => {
  try { localStorage.setItem(CMDI_MODEL_KEY, $cmdiModel.value); } catch {}
});

// If the chat pane just (re-)populated its dropdown, mirror that change
// silently. We watch via MutationObserver because Phase 4 doesn't expose an
// "models loaded" event.
const modelObserver = new MutationObserver(() => {
  if (cmdiOpen) syncCmdiModels();
});
modelObserver.observe($chatModel, { childList: true, attributes: true, attributeFilter: ['disabled'] });

// ── System prompts ──
// Kept as functions so the system message + context + instruction become a
// single string for /chat (which accepts {model, message}).
function buildMarkupPrompt(context, instruction) {
  return [
    'SYSTEM: You are an inline-edit assistant for the Antigravity Bridge DSL.',
    'Reply ONLY with the rewritten/inserted text. NO prose, NO markdown fences, NO commentary.',
    'The DSL uses \\page, \\board name (x,y,w,h) {...}, \\rect, \\ellipse, \\text, \\group, \\bind, \\anchor.',
    'Selected text follows below; rewrite it per the user instruction.',
    '',
    'CONTEXT (selected):',
    context,
    '',
    'INSTRUCTION:',
    instruction,
  ].join('\n');
}
function buildChatPrompt(context, instruction) {
  return [
    'SYSTEM: You are rewriting a draft chat message. Reply ONLY with the rewritten draft. No quotes, no prose, no commentary.',
    '',
    'DRAFT:',
    context,
    '',
    'INSTRUCTION:',
    instruction,
  ].join('\n');
}

// ── Geometry helpers ──
// Position the panel below the source's selection (markup) or above the
// chat input. Clamps to viewport so it never escapes the iframe.
function positionPanelForMarkup() {
  // Anchor below the textarea (we can't measure the exact caret y without a
  // mirror element, so we anchor under the textarea's visible top edge plus
  // the cursor line's approximate y. Best-effort positioning is fine — this
  // is a popover, not a precision tooltip.)
  const rect = $markupArea.getBoundingClientRect();
  // Try to position near the caret line.
  const cs = window.getComputedStyle($markupArea);
  const lineH = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.5) || 18;
  const padTop = parseFloat(cs.paddingTop) || 0;
  const valBefore = $markupArea.value.slice(0, cmdiSelEnd);
  const lineIdx = (valBefore.match(/\n/g) || []).length;
  const yInTextarea = padTop + lineIdx * lineH - $markupArea.scrollTop + lineH;
  // Absolute Y on the page (body is the offset parent).
  let top = rect.top + window.scrollY + yInTextarea + 6;
  let left = rect.left + window.scrollX + 24;
  // Clamp horizontally to viewport.
  const panelW = panel.offsetWidth || 440;
  const vw = document.documentElement.clientWidth;
  if (left + panelW > vw - 8) left = Math.max(8, vw - panelW - 8);
  if (left < 8) left = 8;
  // Clamp vertically — if there's no room below, anchor above the textarea.
  const panelH = panel.offsetHeight || 140;
  const vh = document.documentElement.clientHeight;
  if (top + panelH > window.scrollY + vh - 8) {
    top = rect.top + window.scrollY + Math.max(8, yInTextarea - panelH - 24);
  }
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
}
function positionPanelForChat() {
  const rect = $chatInput.getBoundingClientRect();
  const panelW = panel.offsetWidth || 440;
  const panelH = panel.offsetHeight || 140;
  const vw = document.documentElement.clientWidth;
  let left = rect.left + window.scrollX;
  if (left + panelW > vw - 8) left = Math.max(8, vw - panelW - 8);
  if (left < 8) left = 8;
  // Prefer placing the panel ABOVE the chat input so it doesn't cover the
  // textarea the user is typing into.
  let top = rect.top + window.scrollY - panelH - 6;
  if (top < window.scrollY + 8) {
    // Not enough room above → place below the input.
    top = rect.bottom + window.scrollY + 6;
  }
  panel.style.top = top + 'px';
  panel.style.left = left + 'px';
}

// ── Open / close ──
function openCmdi(mode) {
  if (cmdiOpen) return;
  cmdiMode = mode;
  cmdiOpen = true;
  cmdiLastFocus = document.activeElement;

  if (mode === 'markup') {
    cmdiSource = $markupArea;
    $cmdiModePill.textContent = 'markup';
    $cmdiInput.placeholder = 'Write or edit DSL…';
    cmdiSelStart = $markupArea.selectionStart;
    cmdiSelEnd   = $markupArea.selectionEnd;
    if (cmdiSelStart === cmdiSelEnd) {
      // Nothing selected → expand to the current line.
      const v = $markupArea.value;
      const lineStart = v.lastIndexOf('\n', cmdiSelStart - 1) + 1;
      let lineEnd = v.indexOf('\n', cmdiSelStart);
      if (lineEnd < 0) lineEnd = v.length;
      cmdiSelStart = lineStart;
      cmdiSelEnd = lineEnd;
    }
    cmdiContext = $markupArea.value.slice(cmdiSelStart, cmdiSelEnd);
  } else {
    cmdiSource = $chatInput;
    $cmdiModePill.textContent = 'chat';
    $cmdiInput.placeholder = 'Refine this draft…';
    cmdiContext = $chatInput.value || '';
  }

  syncCmdiModels();
  $cmdiInput.value = '';
  $cmdiStatus.textContent = '';
  $cmdiStatus.className = 'cmdi-status';
  $cmdiSend.disabled = false;

  panel.hidden = false;
  // Position AFTER it's been laid out so offsetWidth/Height are real.
  // Two-pass: render hidden first to get dimensions, then position.
  if (mode === 'markup') positionPanelForMarkup();
  else                   positionPanelForChat();
  // Focus the instruction box.
  setTimeout(() => $cmdiInput.focus(), 0);
}

function closeCmdi(restoreFocus) {
  if (!cmdiOpen) return;
  cmdiOpen = false;
  panel.hidden = true;
  if (cmdiAbort) {
    try { cmdiAbort.abort(); } catch {}
    cmdiAbort = null;
  }
  $cmdiStatus.textContent = '';
  $cmdiStatus.className = 'cmdi-status';
  if (restoreFocus !== false) {
    const tgt = cmdiLastFocus || cmdiSource;
    if (tgt && typeof tgt.focus === 'function') {
      try { tgt.focus(); } catch {}
    }
  }
  cmdiMode = null;
  cmdiSource = null;
  cmdiLastFocus = null;
}

// ── Send ──
async function sendCmdi() {
  if (!cmdiOpen) return;
  const instruction = ($cmdiInput.value || '').trim();
  if (!instruction) {
    $cmdiStatus.className = 'cmdi-status error';
    $cmdiStatus.textContent = 'Enter an instruction first.';
    return;
  }
  const model = $cmdiModel.value;
  if (!model) {
    $cmdiStatus.className = 'cmdi-status error';
    $cmdiStatus.textContent = 'No model selected (is newcore reachable on :3777?).';
    return;
  }

  const message = (cmdiMode === 'markup')
    ? buildMarkupPrompt(cmdiContext, instruction)
    : buildChatPrompt(cmdiContext, instruction);

  $cmdiSend.disabled = true;
  $cmdiInput.disabled = true;
  $cmdiStatus.className = 'cmdi-status thinking';
  $cmdiStatus.innerHTML = '<span class="spinner"></span>thinking…';

  cmdiAbort = new AbortController();
  let resp;
  try {
    const r = await fetch(NEWCORE_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, message }),
      signal: cmdiAbort.signal,
    });
    if (!r.ok) {
      let detail = 'HTTP ' + r.status;
      try { const j = await r.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch {}
      throw new Error(detail);
    }
    resp = await r.json();
  } catch (e) {
    if (e && e.name === 'AbortError') {
      $cmdiStatus.className = 'cmdi-status';
      $cmdiStatus.textContent = '(cancelled)';
    } else {
      const msg = (e && e.message) || String(e);
      const friendly = /failed to fetch|networkerror|load failed/i.test(msg)
        ? 'newcore not reachable at :3777 — is it running?'
        : msg;
      $cmdiStatus.className = 'cmdi-status error';
      $cmdiStatus.textContent = friendly;
    }
    $cmdiSend.disabled = false;
    $cmdiInput.disabled = false;
    cmdiAbort = null;
    return;
  }
  cmdiAbort = null;

  // Persist the user's model pick on first successful send too.
  try { localStorage.setItem(CMDI_MODEL_KEY, model); } catch {}

  const out = (resp && typeof resp.content === 'string') ? resp.content : '';
  if (!out) {
    $cmdiStatus.className = 'cmdi-status error';
    $cmdiStatus.textContent = 'Empty response from model.';
    $cmdiSend.disabled = false;
    $cmdiInput.disabled = false;
    return;
  }

  applyCmdiResult(out);
  closeCmdi(true);
}

// Apply the rewritten text back into the originating field.
function applyCmdiResult(text) {
  if (cmdiMode === 'markup') {
    // Replace [cmdiSelStart, cmdiSelEnd] with text. If the original
    // selection was empty (we expanded to the line), we still REPLACE the
    // expanded range — that's intuitive: "rewrite this line" gives a new
    // line, not appending to it.
    const v = $markupArea.value;
    const before = v.slice(0, cmdiSelStart);
    const after  = v.slice(cmdiSelEnd);
    $markupArea.value = before + text + after;
    // Place caret at the end of the inserted text.
    const caret = (before + text).length;
    try { $markupArea.setSelectionRange(caret, caret); } catch {}
    // Trigger the Phase 2 compile pipeline via the standard input event.
    $markupArea.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (cmdiMode === 'chat') {
    $chatInput.value = text;
    try {
      const caret = text.length;
      $chatInput.setSelectionRange(caret, caret);
    } catch {}
    $chatInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

// ── Wiring ──
$cmdiSend.addEventListener('click', sendCmdi);

$cmdiInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    closeCmdi(true);
    return;
  }
  // Cmd+Enter / Ctrl+Enter → send. Plain Enter → newline (default).
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    sendCmdi();
  }
});

// Cmd+I trigger on markup textarea.
$markupArea.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'i' || e.key === 'I')) {
    e.preventDefault();
    openCmdi('markup');
  }
});

// Cmd+I trigger on chat input.
$chatInput.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'i' || e.key === 'I')) {
    e.preventDefault();
    openCmdi('chat');
  }
});

// Close on click outside the panel. We do NOT close when clicking inside the
// originating textarea — selection changes should be allowed without losing
// the in-progress instruction. But clicking anywhere else dismisses.
document.addEventListener('mousedown', (e) => {
  if (!cmdiOpen) return;
  if (panel.contains(e.target)) return;
  if (cmdiSource && cmdiSource.contains(e.target)) return;
  closeCmdi(false);
});

// Reposition on window resize so the panel doesn't drift offscreen.
window.addEventListener('resize', () => {
  if (!cmdiOpen) return;
  if (cmdiMode === 'markup') positionPanelForMarkup();
  else                       positionPanelForChat();
});

// One-time placeholder hint for the chat input when it's empty. We append
// the hint to the *existing* placeholder rather than overwriting it so the
// Phase 4 "Cmd+Enter to send" guidance is preserved.
(function annotateChatPlaceholder() {
  const base = $chatInput.getAttribute('placeholder') || '';
  if (!/cmd\+i/i.test(base)) {
    $chatInput.setAttribute('placeholder', base + '   (⌘I to rewrite)');
  }
})();
</script>
</body>
