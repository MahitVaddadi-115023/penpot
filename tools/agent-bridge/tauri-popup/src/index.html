<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity</title>
  <style>
    /* Dark theme matching agent-plugin */
    :root {
      --bg: #1e1e1e;
      --panel: #252525;
      --border: #333;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #b692f6;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 13px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
      -webkit-app-region: drag;
    }
    .shortcut-hint {
      font-size: 10px;
      color: var(--muted);
    }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      outline: none;
      max-width: 200px;
    }
    select:focus { border-color: var(--accent); }
    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      resize: none;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .draft-preview {
      max-height: 40px;
      overflow: hidden;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .draft-preview.empty { font-style: italic; }
    .send-btn {
      background: var(--accent);
      color: #1a1a1a;
      border: 0;
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
      flex: 1;
    }
    .status.thinking::after {
      content: "";
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 4px;
      animation: pulse 1s infinite;
      vertical-align: middle;
    }
    .status.error { color: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    /* First-run banner: shown when macOS Accessibility permission is missing,
       so the user knows why auto-paste won't fire. */
    .ax-banner {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #3a2a3a;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text);
    }
    .ax-banner.show { display: flex; }
    .ax-banner .ax-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ax-banner .ax-msg { flex: 1; }
    .ax-banner button {
      background: var(--accent);
      color: #1a1a1a;
      border: 0;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .ax-banner button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .ax-banner .ax-hint {
      color: var(--muted);
      font-size: 10px;
    }
    .ax-banner .ax-hint:empty { display: none; }
    .manual-paste-footer {
      display: none;
      font-size: 11px;
      color: var(--accent);
      padding: 4px 2px 0;
    }
    .manual-paste-footer.show { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <div class="title">Antigravity</div>
      <div class="shortcut-hint">Esc to close, Cmd+Enter to send</div>
    </div>
    <div id="ax-banner" class="ax-banner" role="status">
      <div class="ax-row">
        <span class="ax-msg">&#9888; Auto-paste needs Accessibility permission.</span>
        <button id="ax-grant" type="button">Grant&hellip;</button>
        <button id="ax-skip" class="secondary" type="button">Skip</button>
      </div>
      <div id="ax-hint" class="ax-hint"></div>
    </div>
    <div id="draft" class="draft-preview empty">(no draft on clipboard, type your prompt)</div>
    <textarea id="prompt" placeholder="Rewrite, summarize, fix, translate, then Cmd+Enter"></textarea>
    <div class="row">
      <select id="model" aria-label="Model"></select>
      <div id="status" class="status"></div>
      <button id="send" class="send-btn">Send</button>
    </div>
    <div id="manual-paste-footer" class="manual-paste-footer"></div>
  </div>

  <script>
    // Tauri 2.x exposes APIs under window.__TAURI__ when withGlobalTauri = true.
    const invoke = window.__TAURI__.core.invoke;
    const listen = window.__TAURI__.event.listen;

    const $prompt = document.getElementById('prompt');
    const $model = document.getElementById('model');
    const $send = document.getElementById('send');
    const $status = document.getElementById('status');
    const $draft = document.getElementById('draft');
    const $axBanner = document.getElementById('ax-banner');
    const $axGrant = document.getElementById('ax-grant');
    const $axSkip = document.getElementById('ax-skip');
    const $axHint = document.getElementById('ax-hint');
    const $manualPasteFooter = document.getElementById('manual-paste-footer');

    let draftText = '';
    let currentModels = [];
    // Cached result of check_accessibility() at popup-open time.
    // null = unknown, true = granted, false = denied (banner showing).
    let axGranted = null;
    // Did the user dismiss the banner this session? We don't persist —
    // they get a fresh check next launch in case permission changed.
    let axBannerDismissed = false;

    function setStatus(msg, kind) {
      $status.className = 'status' + (kind ? ' ' + kind : '');
      $status.textContent = msg || '';
    }

    function showAxBanner(show) {
      if (show && !axBannerDismissed) {
        $axBanner.classList.add('show');
      } else {
        $axBanner.classList.remove('show');
      }
    }

    function setManualPasteFooter(msg) {
      if (msg) {
        $manualPasteFooter.textContent = msg;
        $manualPasteFooter.classList.add('show');
      } else {
        $manualPasteFooter.textContent = '';
        $manualPasteFooter.classList.remove('show');
      }
    }

    async function refreshAccessibility() {
      try {
        const ok = await invoke('check_accessibility');
        axGranted = !!ok;
      } catch {
        // If the command itself errored, assume worst case so we still warn.
        axGranted = false;
      }
      showAxBanner(axGranted === false);
      return axGranted;
    }

    function setDraftPreview(text) {
      draftText = text || '';
      if (!draftText.trim()) {
        $draft.classList.add('empty');
        $draft.textContent = '(no draft on clipboard, type your prompt)';
      } else {
        $draft.classList.remove('empty');
        const oneLine = draftText.replace(/\s+/g, ' ').slice(0, 200);
        $draft.textContent = 'Draft: ' + oneLine + (draftText.length > 200 ? '...' : '');
      }
    }

    async function loadModels() {
      try {
        const models = await invoke('get_models');
        currentModels = Array.isArray(models) ? models : [];
        $model.innerHTML = '';
        if (currentModels.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = '(no models)';
          $model.appendChild(opt);
          return;
        }
        for (const m of currentModels) {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          $model.appendChild(opt);
        }
        const last = localStorage.getItem('lastModel');
        if (last && currentModels.includes(last)) $model.value = last;
      } catch (err) {
        $model.innerHTML = '<option value="">(newcore offline)</option>';
        setStatus('newcore unreachable on :3777', 'error');
      }
    }

    async function captureClipboardDraft() {
      try {
        const text = await window.__TAURI__.clipboardManager.readText();
        setDraftPreview(text || '');
      } catch {
        setDraftPreview('');
      }
    }

    async function onOpen() {
      setStatus('');
      setManualPasteFooter('');
      $axHint.textContent = '';
      $prompt.value = '';
      // Recheck AX permission each time the popup opens. Cheap (one osascript)
      // and ensures we react if the user toggled the permission since last open.
      refreshAccessibility();
      await captureClipboardDraft();
      // small async gap so the window has actually appeared before focusing
      setTimeout(() => $prompt.focus(), 30);
    }

    async function submit() {
      const instruction = $prompt.value.trim();
      if (!instruction) {
        setStatus('Type an instruction first.', 'error');
        $prompt.focus();
        return;
      }
      const model = $model.value;
      if (!model) {
        setStatus('No model selected.', 'error');
        return;
      }
      localStorage.setItem('lastModel', model);
      $send.disabled = true;
      setStatus('thinking', 'thinking');
      try {
        const result = await invoke('submit_instruction', {
          instruction: instruction,
          model: model,
          draft: draftText,
        });
        setStatus('pasting...');
        // paste_result now returns { ok, pasted, error } so we can distinguish
        // "clipboard set but AX-blocked" from a hard failure.
        const outcome = await invoke('paste_result', { text: result }) || {};
        if (outcome.ok === false) {
          setStatus(outcome.error || 'Paste failed.', 'error');
        } else if (outcome.pasted === false) {
          // Clipboard has the result but the keystroke didn't fire.
          // Surface the manual-paste hint so the user isn't left in the dark.
          setManualPasteFooter(
            'Result copied to clipboard — press Cmd+V to paste manually.'
          );
          // Also keep the banner visible so they can grant permission next time.
          if (axGranted === false || outcome.error) {
            showAxBanner(true);
          }
        }
        // paste_result hides the popup itself, but call hide_popup defensively
        // only when we actually completed cleanly with a keystroke. If the user
        // needs to read the manual-paste hint, leave the window up.
        if (outcome.pasted) {
          await invoke('hide_popup');
        }
      } catch (err) {
        setStatus(String(err), 'error');
      } finally {
        $send.disabled = false;
      }
    }

    // wire up events
    $send.addEventListener('click', submit);
    $axGrant.addEventListener('click', async () => {
      try {
        await invoke('open_accessibility_settings');
        $axHint.textContent =
          'Toggle Antigravity Popup on, then close this and try again.';
      } catch (err) {
        $axHint.textContent = 'Could not open settings: ' + String(err);
      }
    });
    $axSkip.addEventListener('click', () => {
      // Session-only dismiss; we recheck next launch in case the user grants it.
      axBannerDismissed = true;
      showAxBanner(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        invoke('hide_popup');
      } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        submit();
      }
    });

    // re-snapshot clipboard every time the popup is shown
    listen('popup-shown', onOpen);

    // initial population
    loadModels();
    onOpen();
  </script>
</body>
</html>
